<!doctype html>
<html lang="pt-AO">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portal DSI · MHAIS</title>
  <link rel="icon" href="/static/marca/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/styles.css">
  <link rel="stylesheet" href="/static/marca/marca.css">
</head>
<body>
  <header>
    <a class="marca" href="/#inicio"><img id="logo" src="/static/marca/logo.svg" alt="MHAIS"><span id="nome-portal">Portal DSI</span></a>
    <nav id="nav"></nav>
    <div class="utilizador" id="utilizador"></div>
  </header>
  <main id="conteudo"></main>
  <footer id="rodape"></footer>

  <dialog id="dialogo">
    <form method="dialog" id="form-dialogo">
      <h2 id="dialogo-titulo"></h2>
      <div id="dialogo-corpo"></div>
      <p class="erro" id="dialogo-erro"></p>
      <menu>
        <button value="cancelar" formnovalidate>Fechar</button>
        <button value="gravar" id="btn-gravar" class="primario">Gravar</button>
      </menu>
    </form>
  </dialog>

  <script src="/static/app.js"></script>
</body>
</html>
